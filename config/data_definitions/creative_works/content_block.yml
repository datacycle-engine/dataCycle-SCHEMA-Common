---
- :data:
    :name: ContentBlock
    :type: object
    :schema_ancestors:
      - CreativeWork
    :content_type: embedded
    :api:
      :type: dcls:Inhaltsblock
    :properties:
      :id:
        :label: id
        :type: key
      :name:
        :label: Überschrift
        :type: string
        :storage_location: translated_value
        :search: true
      :alternative_headline:
        :label: Unterüberschrift
        :type: string
        :storage_location: translated_value
        :search: true
        :advanced_search: true
      :text:
        :label: Text
        :type: string
        :storage_location: translated_value
        :search: true
        :ui:
          :edit:
            :type: text_editor
            :options:
              :data-size: full
        :advanced_search: true
      :image:
        :label: Bilder
        :type: linked
        :template_name: ImageObject
      :meta_data:
        :type: mixin
        :name: meta_data
